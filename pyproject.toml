[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A-Maze-ing generator package for the 42 Common Core"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]

authors = [
	{ name = "jbartos", email = "jbartos@student.42.warsaw.pl" },
	{ name = "wszlaga", email = "wszlaga@student.42.warsaw.pl" }
]
dependencies = []

[tool.setuptools.packages.find]
include = ["mazegen*"]

[tool.mypy]
exclude = ["maze_analyzer\\.py", "build", "dist"]